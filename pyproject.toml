[project]
name = "dagps"
version = "0.1.0"
description = "FastAPI wrapper for www.dagps.net"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
